name: Stage 06 Checkpoint Sync

on:
  push:
    branches: [stage06-android-safe-open-spike]
    paths:
      - .github/workflows/stage06-checkpoint-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch canonical checkpoints
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          plan = 'Mobil_DWG_DXF_Royalty_Free_Android_iOS_Nihai_Plan.md'
          old_checkpoint = '''CURRENT_STAGE: AŞAMA 05
          CURRENT_SUBSTEP: 05.6
          STATUS: DONE
          LAST_VERIFIED_REVISION: 09e26172aa8de9e8c79ae64853a493dab1d0e5b9 — AŞAMA 05 implementation head locked restore + mini corpus + regresyon kapılarında doğrulandı; PR #7 kapanış belgeleriyle main'e merge edilecek
          LAST_SUCCESSFUL_COMMAND: GitHub Actions Stage 05 Parser Spike run 32759096003 / #8 SUCCESS + aynı implementation head Stage 04 Architecture run 32759095988 / #11 SUCCESS + Stage 02 Dependency Audit run 32759095944 / #25 SUCCESS + Stage 01 Toolchain Smoke run 32759095888 / #44 SUCCESS
          EVIDENCE: docs/evidence/STAGE_05.md; docs/ADR/0001-acadsharp-3.7.1-parser-baseline.md; Stage 05 artifact 9532001644 sha256:2750ba88141c5724306bb5811173d958c60836806021f2ff1a5b36b011631097; STAGE05_DEPENDENCY_BOUNDARY_PASS; STAGE05_MINI_CORPUS_PASS fixtures=9 derived_negatives=2; STAGE05_T3_PASS
          BLOCKERS: AŞAMA 05 için yok. AŞAMA 01 fiziksel Android install/launch ve iOS erişim envanteri docs/USER_APPROVED_EXECUTION_OVERRIDE.md gereği DEFERRED_EXTERNAL_GATE olarak açık kalır; Stage 01 CI #44 bu dış kapıları PASS/DONE yapmaz.
          NEXT_ACTION: AŞAMA 06 — Android güvenli dosya alma ve parse spike. AŞAMA 01 dış kapılarını sahte PASS/DONE yapma; aynı turda AŞAMA 06'yı başlatma.
          LAST_UPDATE: 2026-08-24'''.replace('          ', '')
          new_checkpoint = '''CURRENT_STAGE: AŞAMA 06
          CURRENT_SUBSTEP: 06.7
          STATUS: BLOCKED
          LAST_VERIFIED_REVISION: 56de020fb1297b8642c4f84c24522bbd723272f8 — AŞAMA 06 cihazdan bağımsız safe-open + gerçek DWG/DXF probe + generated MAUI Android Debug/Release CI kapıları geçti; fiziksel Android kapısı DEFERRED_EXTERNAL_GATE
          LAST_SUCCESSFUL_COMMAND: GitHub Actions Stage 06 Safe Open run 32762879583 / #3 SUCCESS + aynı head Stage 04 Architecture run 32762879643 / #22 SUCCESS + Stage 02 Dependency Audit run 32762879581 / #35 SUCCESS + Stage 01 Toolchain Smoke run 32762879589 / #54 SUCCESS
          EVIDENCE: docs/evidence/STAGE_06.md; Stage 06 artifact 9533538573 sha256:18c7c395e24b6e3d686edef03d3d0ad686c21fad82686704ef38e7e098a25ea3; STAGE06_ACTUAL_DWG_DXF_PASS; STAGE06_SAFE_COPY_GUARDS_PASS; STAGE06_LAST_REQUEST_WINS_PASS; STAGE06_CANCEL_SEMANTICS_PASS; STAGE06_ANDROID_DEBUG_BUILD_PASS; STAGE06_ANDROID_RELEASE_BUILD_PASS; STAGE06_CI_GATE_PASS
          BLOCKERS: AŞAMA 06 gerçek Android telefonda FilePicker/SAF ile DWG+DXF açma, cancel/rotate/background/close ve app-private cache cleanup kanıtı olmadan DONE değildir. AŞAMA 01 fiziksel Android install/launch ve iOS erişim envanteri de DEFERRED_EXTERNAL_GATE olarak açık kalır.
          NEXT_ACTION: docs/USER_APPROVED_EXECUTION_OVERRIDE.md gereği AŞAMA 07 — ProCad source-pinned Android spike ve GO/NO-GO. AŞAMA 06 fiziksel Android kapısı açık kalır ve sahte PASS/DONE yapılmaz.
          LAST_UPDATE: 2026-08-24'''.replace('          ', '')
          replace_once(plan, old_checkpoint, new_checkpoint)

          replace_once(plan,
              '- [ ] AŞAMA 06 — Android güvenli dosya alma ve parse spike — `NEXT`\n- [ ] AŞAMA 07 — ProCad source-pinned Android spike ve GO/NO-GO',
              '- [ ] AŞAMA 06 — Android güvenli dosya alma ve parse spike — `BLOCKED / DEFERRED_EXTERNAL_GATE`\n- [ ] AŞAMA 07 — ProCad source-pinned Android spike ve GO/NO-GO — `NEXT`')

          old_stage06 = '''### AŞAMA 06 — Android güvenli dosya alma ve parse spike

          **Amaç:** Gerçek content URI’den dosyayı güvenli biçimde alıp UI’ı kilitlemeden parse etmek.

          İşler:

          - [ ] MAUI FilePicker/Android SAF content URI akışı uygulanır.
          - [ ] Provider filename sanitize, bildirilen boyuta güvenmeyen stream byte quota, boş disk kontrolü, progress, atomic unique cache file, stream disposal ve deterministic cleanup eklenir.
          - [ ] Persistable grant yalnız gerçekten gerekirse ve platform kurallarına uygun alınır.
          - [ ] Parse UI thread dışında çalışır; cooperative cancellation yoksa kullanıcıya yanlış “parser durdu” sözü verilmez.
          - [ ] Her açma isteği generation ID taşır; hızlı ikinci seçimde eski parse sonucu UI’a yazılmaz (`last request wins`).
          - [ ] Metadata/diagnostics ekranına kadar gerçek telefonda DWG ve DXF açılır.
          - [ ] Original dosya hiçbir koşulda yazılmaz.

          Test: Android Debug + Release; küçük DWG/DXF, cancel UI, rotate/background/close.  
          Çıkış: Gerçek telefon yerel dosyayı güvenle okur, parse sonucu/uyarısı gösterir, temp dosya sızıntısı yoktur.'''.replace('          ', '')
          new_stage06 = '''### AŞAMA 06 — Android güvenli dosya alma ve parse spike

          **Amaç:** Gerçek content URI’den dosyayı güvenli biçimde alıp UI’ı kilitlemeden parse etmek.

          İşler:

          - [x] MAUI FilePicker/Android SAF content URI akışı source spike olarak uygulandı; `FilePicker.Default.PickAsync` + `FileResult.OpenReadAsync()` kullanılır, provider fiziksel path'ine güvenilmez.
          - [x] Provider filename sanitize, bildirilen boyuta güvenmeyen actual stream byte quota, boş disk reserve kontrolü, progress, atomic unique app-private cache file, stream disposal ve deterministic cleanup eklendi.
          - [x] Stage 06 immediate private-copy akışında persistable grant gerekmediği doğrulandı ve alınmadı; kalıcı recent-file erişimi AŞAMA 18 kapsamındadır.
          - [x] Parse UI thread dışında worker hattında çalışır; cooperative cancellation yoksa kullanıcıya yanlış “parser durdu” sözü verilmez ve geç sonuç terk edilir.
          - [x] Her açma isteği generation ID taşır; hızlı ikinci seçimde eski parse sonucu commit edilmez (`last request wins`).
          - [ ] Metadata/diagnostics ekranına kadar **gerçek fiziksel Android telefonda** DWG ve DXF açılır; cancel/rotate/background/close ve gerçek cihaz cache cleanup smoke yapılır. `DEFERRED_EXTERNAL_GATE`.
          - [x] Original dosya hiçbir koşulda write modunda açılmaz; probe öncesi/sonrası DWG/DXF hash'leri değişmedi.

          Test: CI'da gerçek pinned DWG + sentetik DXF safe-open T2 probe, quota/disk/cleanup/last-request-wins/cancel semantics ve generated MAUI Android Debug+Release build PASS; minSdk 24 / targetSdk 36, broad storage permission yok. Final implementation run `32762879583` / #3 `SUCCESS`, artifact `9533538573`, digest `sha256:18c7c395e24b6e3d686edef03d3d0ad686c21fad82686704ef38e7e098a25ea3`. Gerçek telefon FilePicker/SAF, cancel UI, rotate/background/close ve cache leak testi fiziksel cihaz erişimi olmadığı için `DEFERRED_EXTERNAL_GATE`.  
          Çıkış: **Henüz sağlanmadı.** Cihazdan bağımsız implementation/CI kısmı PASS; gerçek telefon exit gate'i açık olduğundan AŞAMA 06 `BLOCKED / DEFERRED_EXTERNAL_GATE`. Kullanıcı onaylı execution override bağımsız AŞAMA 07'nin ilerlemesine izin verir.'''.replace('          ', '')
          replace_once(plan, old_stage06, new_stage06)

          gecmis = 'gecmis.md'
          old_gec_checkpoint = '''LAST_COMPLETED_STAGE: AŞAMA 05
          DEFERRED_STAGE: AŞAMA 01
          DEFERRED_STAGE_STATUS: BLOCKED / DEFERRED_EXTERNAL_GATE — dış erişim bekliyor, DONE değil
          NEXT_WORK_STAGE: AŞAMA 06
          NEXT_WORK_STATUS: NOT_STARTED'''.replace('          ', '')
          new_gec_checkpoint = '''LAST_COMPLETED_STAGE: AŞAMA 05
          DEFERRED_STAGES: AŞAMA 01; AŞAMA 06
          STAGE01_STATUS: BLOCKED / DEFERRED_EXTERNAL_GATE — fiziksel Android install/launch ve iOS erişim envanteri açık, DONE değil
          STAGE06_STATUS: BLOCKED / DEFERRED_EXTERNAL_GATE — safe-open implementation/CI PASS, fiziksel Android FilePicker/SAF+lifecycle/cache gate açık, DONE değil
          NEXT_WORK_STAGE: AŞAMA 07
          NEXT_WORK_STATUS: NOT_STARTED'''.replace('          ', '')
          replace_once(gecmis, old_gec_checkpoint, new_gec_checkpoint)

          replace_once(gecmis,
              'DEFERRED_EXTERNAL_GATES: STAGE01_DEVICE_GATE_PASS; local Android install/launch; iOS erişim envanteri YES/NO/N/A',
              'DEFERRED_EXTERNAL_GATES: STAGE01_DEVICE_GATE_PASS; local Android install/launch; iOS erişim envanteri YES/NO/N/A; STAGE06_PHYSICAL_ANDROID_FILEPICKER_DWG_DXF; cancel/rotate/background/close/cache-cleanup')

          marker = 'LAST_VERIFIED_STAGE05_CI: Stage 05 Parser Spike run 32760139261 / #15 SUCCESS; locked restore; Release build 0 warning / 0 error; STAGE05_DEPENDENCY_BOUNDARY_PASS; STAGE05_MINI_CORPUS_PASS fixtures=9 derived_negatives=2; STAGE05_T3_PASS; artifact 9532379884; sha256:f3b31c937186d874a0ed23c045951d465ace5da8fff2f9acc32006c4352e2f60\n'
          addition = marker + 'LAST_VERIFIED_STAGE06_CI: Stage 06 Safe Open run 32762879583 / #3 SUCCESS; actual DWG+DXF safe-open; quota/disk/cleanup; last-request-wins; cancel semantics; Android Debug+Release; artifact 9533538573; sha256:18c7c395e24b6e3d686edef03d3d0ad686c21fad82686704ef38e7e098a25ea3\n'
          replace_once(gecmis, marker, addition)
          replace_once(gecmis, 'LAST_VERIFIED_STAGE04_REGRESSION_CI: Stage 04 Architecture run 32760139230 / #18 SUCCESS', 'LAST_VERIFIED_STAGE04_REGRESSION_CI: Stage 04 Architecture run 32762879643 / #22 SUCCESS')
          replace_once(gecmis, 'LAST_VERIFIED_STAGE02_REGRESSION_CI: Stage 02 Dependency Audit run 32760139219 / #32 SUCCESS', 'LAST_VERIFIED_STAGE02_REGRESSION_CI: Stage 02 Dependency Audit run 32762879581 / #35 SUCCESS')
          replace_once(gecmis, 'LAST_VERIFIED_STAGE01_REGRESSION_CI: Stage 01 Toolchain Smoke run 32760139285 / #51 SUCCESS; physical device evidence değildir.', 'LAST_VERIFIED_STAGE01_REGRESSION_CI: Stage 01 Toolchain Smoke run 32762879589 / #54 SUCCESS; physical device evidence değildir.')
          replace_once(gecmis,
              'STAGE05_MERGE: bbe5b62224ae6e7fdaebd1c1c6ace87418f09b9f\nEXECUTION_OVERRIDE:',
              'STAGE05_MERGE: bbe5b62224ae6e7fdaebd1c1c6ace87418f09b9f\nSTAGE06_IMPLEMENTATION_HEAD: 56de020fb1297b8642c4f84c24522bbd723272f8\nSTAGE06_PR: #8 — stage06: validate Android safe file open flow\nSTAGE06_MERGE: PENDING — doğrulanmış branch merge edilecek; fiziksel cihaz gate bu merge ile DONE olmaz\nEXECUTION_OVERRIDE:')
          replace_once(gecmis,
              'NEXT_ACTION: AŞAMA 06 — Android güvenli dosya alma ve parse spike. Bu AŞAMA 05 kapanış turunda AŞAMA 06 başlatılmaz.',
              'NEXT_ACTION: AŞAMA 07 — ProCad source-pinned Android spike ve GO/NO-GO. AŞAMA 06 fiziksel Android gate açık kalır; aynı AŞAMA 06 kapanış turunda AŞAMA 07 başlatılmaz.')
          replace_once(gecmis,
              '- [ ] AŞAMA 06 — Android güvenli dosya alma ve parse spike — `NEXT`\n- [ ] AŞAMA 07 — ProCad source-pinned Android spike ve GO/NO-GO',
              '- [ ] AŞAMA 06 — Android güvenli dosya alma ve parse spike — `BLOCKED / DEFERRED_EXTERNAL_GATE`\n- [ ] AŞAMA 07 — ProCad source-pinned Android spike ve GO/NO-GO — `NEXT`')
          replace_once(gecmis, '4. `docs/evidence/STAGE_05.md`', '4. `docs/evidence/STAGE_06.md`\n5. `docs/evidence/STAGE_05.md`')
          # Renumber only the immediate subsequent startup list items to avoid duplicate numbering ambiguity.
          text = Path(gecmis).read_text(encoding='utf-8')
          for old, new in [('5. `docs/ADR/', '6. `docs/ADR/'), ('6. `docs/ARCHITECTURE', '7. `docs/ARCHITECTURE'), ('7. `docs/evidence/STAGE_04', '8. `docs/evidence/STAGE_04'), ('8. `docs/evidence/STAGE_03', '9. `docs/evidence/STAGE_03'), ('9. `docs/evidence/STAGE_02', '10. `docs/evidence/STAGE_02'), ('10. `docs/EXECUTION_LOG', '11. `docs/EXECUTION_LOG'), ('11. `docs/TOOLCHAIN', '12. `docs/TOOLCHAIN')]:
              text = text.replace(old, new, 1)
          Path(gecmis).write_text(text, encoding='utf-8')

          insert_before = '\n## Değiştirilemez temel teknik kararlar\n'
          stage06_history = '''
          ### AŞAMA 06 — BLOCKED / DEFERRED_EXTERNAL_GATE

          Cihazdan bağımsız safe-open implementation ve CI hattı tamamlandı:

          - Stream-factory tabanlı `CadFileSelection`; provider fiziksel path'ine bağımlılık yok.
          - Sanitized provider filename, actual-byte quota, free-space reserve, atomic unique app-private cache copy ve deterministic cleanup.
          - Original DWG/DXF write modunda açılmıyor; probe öncesi/sonrası hash değişmedi.
          - Generation ID + `last request wins`; stale parser sonucu session/cache dispose edilip UI state'e commit edilmiyor.
          - Parser başladıktan sonra cooperative cancellation vaat edilmiyor; cancel talebi sonrası geç sonuç terk ediliyor.
          - `spikes/Stage06.Android/Stage06MainPage.cs` ile MAUI `FilePicker.Default.PickAsync` + `FileResult.OpenReadAsync()` source spike.
          - Generated MAUI Android Debug/Release build, minSdk 24 / targetSdk 36, broad external-storage permission olmadan geçti.
          - Final implementation CI: `Stage 06 Safe Open` run `32762879583` / #3 `SUCCESS`; artifact `9533538573`, digest `sha256:18c7c395e24b6e3d686edef03d3d0ad686c21fad82686704ef38e7e098a25ea3`.
          - Aynı head Stage 04 #22, Stage 02 #35 ve Stage 01 #54 `SUCCESS`.

          Açık dış kapı: gerçek Android telefonda FilePicker/SAF ile DWG+DXF açma, metadata/diagnostics, cancel, hızlı ikinci seçim, rotate, background/foreground, close/reopen ve app-private cache leak kontrolü. Bu yüzden AŞAMA 06 `DONE` değildir.

          Ayrıntı: `docs/evidence/STAGE_06.md`.
          '''.replace('          ', '')
          text = Path(gecmis).read_text(encoding='utf-8')
          if insert_before not in text:
              raise SystemExit('gecmis insert marker missing')
          text = text.replace(insert_before, '\n' + stage06_history + insert_before, 1)
          text = text.replace('4. Kullanıcı yalnız `devam` diyorsa `NEXT_WORK_STAGE` üzerinden ilerle. Şu anda bu AŞAMA 06\'dır.', '4. Kullanıcı yalnız `devam` diyorsa `NEXT_WORK_STAGE` üzerinden ilerle. AŞAMA 06 merge sonrasında bu AŞAMA 07\'dir.', 1)
          text = text.replace('Kullanıcı `devam` dediğinde yalnız AŞAMA 06 — Android güvenli dosya alma ve parse spike — başlatılır. Aynı turda AŞAMA 07\'ye geçilmez.', 'AŞAMA 06 PR #8 main\'e merge edilip merge SHA checkpoint\'e işlendiğinde kullanıcı `devam` derse yalnız AŞAMA 07 — ProCad source-pinned Android spike ve GO/NO-GO — başlatılır. AŞAMA 06 fiziksel Android gate açık kalır.', 1)
          Path(gecmis).write_text(text, encoding='utf-8')

          log = Path('docs/EXECUTION_LOG.md')
          text = log.read_text(encoding='utf-8')
          if '## 2026-08-24 — AŞAMA 06 — BLOCKED / DEFERRED_EXTERNAL_GATE' not in text:
              text += '''

          ---

          ## 2026-08-24 — AŞAMA 06 — BLOCKED / DEFERRED_EXTERNAL_GATE

          Başlangıç main: `b0262877b0273c5854e671c95e0c11601dfcd170`.

          Yapılanlar:

          - `MobilDwg.App` içinde stream-factory tabanlı safe-open kontratları, actual-byte quota, disk reserve, sanitized filename, atomic unique app-private cache copy ve deterministic cleanup eklendi.
          - Parse worker thread'e taşındı; parser cooperative cancel desteklemiyorsa hard-stop iddiası yapılmıyor.
          - Generation ID / `last request wins` ile stale parser sonuçları dispose edilip commit edilmiyor.
          - Gerçek pinned AC1015 DWG + committed sentetik DXF safe-open probe'u geçti; original hash'ler değişmedi.
          - Quota, provider declared-size yalanı, disk reserve, source disposal, temp leak, last-request-wins ve cancel-result-discard testleri geçti.
          - MAUI Android FilePicker/OpenReadAsync spike'ı generated temiz uygulamada Debug+Release derlendi; minSdk 24, targetSdk 36; broad storage permission yok.

          CI sırasında yakalanan gerçek sorunlar:

          1. App kullanıcı mesajında parser vendor adı geçtiği için architecture source-boundary guard fail verdi; App parser-agnostic hale getirildi.
          2. Static provider-path guard app-private cache normalizationındaki `Path.GetFullPath` çağrısını yanlış pozitif saydı; guard yalnız MAUI provider adapter source'una daraltıldı.

          Final implementation CI head `56de020fb1297b8642c4f84c24522bbd723272f8`:

          - Stage 06 Safe Open run `32762879583` / #3 `SUCCESS`.
          - Stage 04 Architecture run `32762879643` / #22 `SUCCESS`.
          - Stage 02 Dependency Audit run `32762879581` / #35 `SUCCESS`.
          - Stage 01 Toolchain Smoke run `32762879589` / #54 `SUCCESS`; fiziksel cihaz kanıtı değildir.
          - Evidence artifact `9533538573`, digest `sha256:18c7c395e24b6e3d686edef03d3d0ad686c21fad82686704ef38e7e098a25ea3`.

          Açık dış kapı: gerçek fiziksel Android telefonda FilePicker/SAF DWG+DXF, metadata/diagnostics, cancel, hızlı ikinci seçim, rotate, background/foreground, close/reopen ve cache leak smoke. Bu nedenle AŞAMA 06 `DONE` değildir; `BLOCKED / DEFERRED_EXTERNAL_GATE` kalır.

          Kullanıcı onaylı `docs/USER_APPROVED_EXECUTION_OVERRIDE.md` gereği AŞAMA 06 PR #8 merge edildikten sonra sonraki bağımsız çalışma AŞAMA 07 olabilir; AŞAMA 06 fiziksel gate release/beta/final kapılarında yeniden zorunludur.
          '''.replace('          ', '')
              log.write_text(text, encoding='utf-8')

      - name: Commit synchronized checkpoint and remove helper workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage06-checkpoint-sync.yml
          git add Mobil_DWG_DXF_Royalty_Free_Android_iOS_Nihai_Plan.md gecmis.md docs/EXECUTION_LOG.md
          git commit -m "docs: checkpoint Stage 06 external gate"
          git push origin HEAD:stage06-android-safe-open-spike
