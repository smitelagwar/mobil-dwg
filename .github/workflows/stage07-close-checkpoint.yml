name: Stage 07 Close Checkpoint

on:
  push:
    branches:
      - stage07-procad-source-spike
    paths:
      - scripts/stage07-close-checkpoint.py
      - .github/workflows/stage07-close-checkpoint.yml

permissions:
  contents: write

jobs:
  sync-checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: stage07-procad-source-spike
          fetch-depth: 0

      - name: Patch Stage 07 closure records
        run: python3 scripts/stage07-close-checkpoint.py

      - name: Remove one-shot helper
        run: |
          rm scripts/stage07-close-checkpoint.py
          rm .github/workflows/stage07-close-checkpoint.yml

      - name: Commit synchronized checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(stage07): close ProCad NO-GO checkpoint"
          git push origin HEAD:stage07-procad-source-spike
