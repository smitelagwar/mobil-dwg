name: Stage 09 Canonical Closure Patch

on:
  push:
    branches:
      - stage09-render-scene-camera
    paths:
      - '.github/workflows/stage09-canonical-closure.yml'
      - 'scripts/stage09-canonical-closure.ps1'

permissions:
  contents: write

jobs:
  patch-canonical:
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical Stage 09 checkpoint
        shell: powershell
        run: .\scripts\stage09-canonical-closure.ps1

      - name: Commit canonical closure
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mobil_DWG_DXF_Royalty_Free_Android_iOS_Nihai_Plan.md
          if (-not (git diff --cached --quiet)) {
            git commit -m 'docs(stage09): close canonical plan checkpoint'
            git push origin HEAD:stage09-render-scene-camera
          } else {
            Write-Host 'Canonical plan already closed.'
          }
