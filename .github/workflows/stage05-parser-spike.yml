name: Stage 05 Parser Spike

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Directory.Packages.props
      - src/MobilDwg.Cad/**
      - src/MobilDwg.Core/**
      - tests/MobilDwg.Architecture.Tests/**
      - tools/Stage05.ParserProbe/**
      - scripts/stage05-parser-spike.sh
      - scripts/stage03-validate-fixtures.py
      - fixtures/manifest/stage03-mini.json
      - fixtures/public/synthetic/**
      - docs/evidence/STAGE_05.md
      - .github/workflows/stage05-parser-spike.yml
  push:
    branches: [main]
    paths:
      - Directory.Packages.props
      - src/MobilDwg.Cad/**
      - src/MobilDwg.Core/**
      - tests/MobilDwg.Architecture.Tests/**
      - tools/Stage05.ParserProbe/**
      - scripts/stage05-parser-spike.sh
      - scripts/stage03-validate-fixtures.py
      - fixtures/manifest/stage03-mini.json
      - fixtures/public/synthetic/**
      - .github/workflows/stage05-parser-spike.yml

permissions:
  contents: read

jobs:
  parser-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10.0.400
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Install pinned workload set required by global.json
        shell: bash
        run: |
          set -euxo pipefail
          test "$(dotnet --version)" = "10.0.400"
          dotnet workload install maui-android
          dotnet workload list | tee /tmp/stage05-workloads.txt
          grep -F '10.0.400' /tmp/stage05-workloads.txt
          grep -F 'maui-android' /tmp/stage05-workloads.txt

      - name: Validate Stage 05 runner syntax
        shell: bash
        run: bash -n scripts/stage05-parser-spike.sh

      - name: Run ACadSharp mini-corpus parser gate with committed lock
        shell: bash
        run: |
          bash scripts/stage05-parser-spike.sh \
            "$RUNNER_TEMP/mobil-dwg-stage05" \
            "$RUNNER_TEMP/stage05-parser-evidence.json"

      - name: Upload Stage 05 parser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage05-parser-evidence
          path: |
            ${{ runner.temp }}/stage05-parser-evidence.json
            ${{ runner.temp }}/mobil-dwg-stage05/stage03-fixture-audit.json
            ${{ runner.temp }}/mobil-dwg-stage05/stage05-package-graph.txt
          if-no-files-found: warn
