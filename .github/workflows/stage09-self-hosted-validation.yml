name: Stage 09 Self Hosted Validation Probe

on:
  push:
    branches:
      - stage09-render-scene-camera
    paths:
      - '.github/workflows/stage09-self-hosted-validation.yml'

permissions:
  contents: read

jobs:
  render-scene-self-hosted:
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& dotnet --version).Trim()
          if ($version -ne '10.0.400') {
            throw "Expected .NET SDK 10.0.400, got $version"
          }
          Write-Host 'STAGE09_SELF_HOSTED_DOTNET_PIN_PASS'

      - name: Restore and build Stage 09 tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & dotnet restore tests/MobilDwg.Rendering.Tests/MobilDwg.Rendering.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Stage 09 restore failed' }
          & dotnet build tests/MobilDwg.Rendering.Tests/MobilDwg.Rendering.Tests.csproj -c Release --no-restore /warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Stage 09 build failed' }
          Write-Host 'STAGE09_SELF_HOSTED_T0_BUILD_PASS'

      - name: Run deterministic scene and camera tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & dotnet run --project tests/MobilDwg.Rendering.Tests/MobilDwg.Rendering.Tests.csproj -c Release --no-build 2>&1 | Tee-Object -FilePath stage09-self-hosted.log
          if ($LASTEXITCODE -ne 0) { throw 'Stage 09 test executable failed' }
          if (-not (Select-String -Path stage09-self-hosted.log -Pattern '^STAGE04_RENDER_CONTRACT_TESTS_PASS$' -Quiet)) { throw 'Stage 04 compatibility marker missing' }
          if (-not (Select-String -Path stage09-self-hosted.log -Pattern '^STAGE09_RENDER_SCENE_TESTS_PASS$' -Quiet)) { throw 'Stage 09 pass marker missing' }
          if (-not (Select-String -Path stage09-self-hosted.log -Pattern '^render-scene/v1$' -Quiet)) { throw 'Stage 09 snapshot marker missing' }
          Write-Host 'STAGE09_SELF_HOSTED_T1_SCENE_PASS'

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage09-self-hosted-validation-evidence
          path: stage09-self-hosted.log
          if-no-files-found: error
