name: Android V06 Real App Safe Open

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/MobilDwg.App/**
      - src/MobilDwg.Cad/**
      - src/MobilDwg.Core/**
      - tests/MobilDwg.Architecture.Tests/**
      - tools/Stage06.OpenFlowProbe/**
      - scripts/android-emulator-gate.ps1
      - scripts/stage03-generate-synthetic-dwg.ps1
      - scripts/stage06-safe-open.sh
      - scripts/v06-real-app-safe-open-gate.ps1
      - fixtures/public/synthetic/**
      - .github/workflows/android-v06-validation.yml

permissions:
  contents: read

jobs:
  real-app-safe-open:
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 45

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Revalidate V01 infrastructure prerequisite
        shell: powershell
        run: .\scripts\android-emulator-gate.ps1 -Configuration Release -ArtifactsDir artifacts/v06-v01-prerequisite -AvdName mobil-dwg-api36 -Headless

      - name: Validate real FilePicker SAF safe-open in MobilDwg.App
        shell: powershell
        run: .\scripts\v06-real-app-safe-open-gate.ps1 -Configuration Release -ArtifactsDir artifacts/v06-safe-open

      - name: Upload V06 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-v06-real-app-safe-open-evidence
          path: |
            artifacts/v06-safe-open
            artifacts/v06-v01-prerequisite/summary.txt
          if-no-files-found: warn
          retention-days: 14
