name: A10 Branch Preflight

on:
  push:
    branches:
      - stage10-p0-geometry-draft
    paths:
      - 'docs/A10_PREFLIGHT_TRIGGER'

permissions:
  contents: read

jobs:
  a10-preflight:
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Host geometry and semantic acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          .\scripts\v02-dependency-gate.ps1 -ArtifactsDir artifacts/a10-preflight-v02
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/MobilDwg.Rendering.Tests/MobilDwg.Rendering.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/MobilDwg.Rendering.Tests/MobilDwg.Rendering.Tests.csproj -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/MobilDwg.Rendering.Tests/MobilDwg.Rendering.Tests.csproj -c Release --no-build 2>&1 | Tee-Object artifacts/a10-preflight-render.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content artifacts/a10-preflight-render.log
          foreach ($marker in @('STAGE10_GEOMETRY_PRIMITIVES_TESTS_PASS','STAGE10_TESSELLATION_PRECISION_TESTS_PASS','STAGE10_P0_SEMANTIC_GOLDEN_PASS','STAGE10_CONTROLLED_INVALID_GEOMETRY_WARNING_PASS','STAGE10_SKIA_EXPECTED_CONTENT_HOST_PASS','STAGE09_RENDER_SCENE_TESTS_PASS')) {
            if ($log -notcontains $marker) { throw "Missing preflight marker: $marker" }
          }
          Write-Host 'A10_PREFLIGHT_HOST_PASS'

      - name: Architecture acceptance
        shell: powershell
        run: |
          dotnet restore tests/MobilDwg.Architecture.Tests/MobilDwg.Architecture.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/MobilDwg.Architecture.Tests/MobilDwg.Architecture.Tests.csproj -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/MobilDwg.Architecture.Tests/MobilDwg.Architecture.Tests.csproj -c Release --no-build 2>&1 | Tee-Object artifacts/a10-preflight-architecture.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'A10_PREFLIGHT_ARCHITECTURE_PASS'

      - name: V01 emulator prerequisite
        shell: powershell
        run: .\scripts\android-emulator-gate.ps1 -Configuration Release -ArtifactsDir artifacts/a10-preflight/v01 -AvdName mobil-dwg-api36 -Headless

      - name: Real Android render acceptance
        shell: powershell
        run: .\scripts\a10-android-render-gate.ps1 -Configuration Release -ArtifactsDir artifacts/a10-preflight/android

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a10-branch-preflight-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
