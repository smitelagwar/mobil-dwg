name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/MobilDwg.Core/**'
      - 'src/MobilDwg.Cad/**'
      - 'src/MobilDwg.Rendering/**'
      - 'src/MobilDwg.App/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'scripts/generate-synthetic-dwg.ps1'
      - 'scripts/validate-fixtures.py'
      - 'scripts/verify-fixture-integrity.py'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/MobilDwg.Core/**'
      - 'src/MobilDwg.Cad/**'
      - 'src/MobilDwg.Rendering/**'
      - 'src/MobilDwg.App/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'scripts/generate-synthetic-dwg.ps1'
      - 'scripts/validate-fixtures.py'
      - 'scripts/verify-fixture-integrity.py'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: host-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Verify SDK pin
        shell: bash
        run: test "$(dotnet --version)" = "10.0.400"

      - name: Install pinned Android workload manifests
        shell: bash
        run: dotnet workload install maui-android

      - name: Validate fixture corpus
        shell: bash
        run: python3 scripts/validate-fixtures.py --manifest fixtures/manifest/corpus.json --evidence artifacts/fixture-audit.json

      - name: Verify fixture dual hashes
        shell: bash
        run: python3 scripts/verify-fixture-integrity.py --audit artifacts/fixture-audit.json --integrity fixtures/manifest/source-integrity.json

      - name: Generate synthetic DWG fixture
        shell: pwsh
        run: ./scripts/generate-synthetic-dwg.ps1

      - name: Build Android app
        shell: bash
        run: dotnet build src/MobilDwg.App/MobilDwg.App.csproj -c Release -f net10.0-android36.0 --nologo

      - name: Run core tests
        shell: bash
        run: dotnet run --project tests/MobilDwg.Core.Tests/MobilDwg.Core.Tests.csproj -c Release

      - name: Run rendering tests
        shell: bash
        run: dotnet run --project tests/MobilDwg.Rendering.Tests/MobilDwg.Rendering.Tests.csproj -c Release

      - name: Run architecture tests
        shell: bash
        run: dotnet run --project tests/MobilDwg.Architecture.Tests/MobilDwg.Architecture.Tests.csproj -c Release
