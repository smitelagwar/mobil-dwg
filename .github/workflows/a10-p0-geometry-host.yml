name: A10 P0 Geometry Host Validation

on:
  push:
    branches:
      - stage10-p0-geometry-draft
  pull_request:
    branches: [main]
    paths:
      - 'src/MobilDwg.Rendering/**'
      - 'tests/MobilDwg.Rendering.Tests/**'
      - 'tests/MobilDwg.Architecture.Tests/**'
      - 'Directory.Packages.props'
      - '.github/workflows/a10-p0-geometry-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a10-host-validation:
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Revalidate V02 dependency boundary
        shell: powershell
        run: .\scripts\v02-dependency-gate.ps1 -ArtifactsDir artifacts/a10-v02

      - name: Build and run A10 geometry tests
        shell: powershell
        run: |
          if ((dotnet --version).Trim() -ne '10.0.400') { throw 'A10 requires exact .NET SDK 10.0.400.' }
          dotnet restore tests/MobilDwg.Rendering.Tests/MobilDwg.Rendering.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/MobilDwg.Rendering.Tests/MobilDwg.Rendering.Tests.csproj -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/MobilDwg.Rendering.Tests/MobilDwg.Rendering.Tests.csproj -c Release --no-build 2>&1 | Tee-Object -FilePath artifacts/a10-rendering-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content artifacts/a10-rendering-tests.log
          if ($log -notcontains 'STAGE10_GEOMETRY_PRIMITIVES_TESTS_PASS') { throw 'A10 geometry primitive marker missing.' }
          if ($log -notcontains 'STAGE10_TESSELLATION_PRECISION_TESTS_PASS') { throw 'A10 tessellation marker missing.' }
          if ($log -notcontains 'STAGE09_RENDER_SCENE_TESTS_PASS') { throw 'Stage09 regression marker missing.' }
          Write-Host 'A10_T1_GEOMETRY_HOST_PASS'

      - name: Revalidate architecture boundary
        shell: powershell
        run: |
          dotnet restore tests/MobilDwg.Architecture.Tests/MobilDwg.Architecture.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/MobilDwg.Architecture.Tests/MobilDwg.Architecture.Tests.csproj -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/MobilDwg.Architecture.Tests/MobilDwg.Architecture.Tests.csproj -c Release --no-build 2>&1 | Tee-Object -FilePath artifacts/a10-architecture-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content artifacts/a10-architecture-tests.log
          if ($log -notcontains 'STAGE04_ARCHITECTURE_TESTS_PASS') { throw 'Architecture marker missing.' }
          if ($log -notcontains 'STAGE05_DEPENDENCY_BOUNDARY_PASS') { throw 'Dependency boundary marker missing.' }
          Write-Host 'A10_ARCHITECTURE_BOUNDARY_PASS'

      - name: Upload A10 host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a10-p0-geometry-host-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
