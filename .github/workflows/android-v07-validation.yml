name: Android V07 ProCad Isolation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - tests/MobilDwg.Rendering.Tests/**
      - Directory.Packages.props
      - MobilDwg.sln
      - spikes/ProCad.Android/**
      - docs/ADR/0002-procad-pinned-source-no-go.md
      - docs/evidence/STAGE_07.md
      - scripts/v02-dependency-gate.ps1
      - scripts/v07-procad-isolation-gate.ps1
      - .github/workflows/android-v07-validation.yml

permissions:
  contents: read

jobs:
  procad-isolation:
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 35

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Revalidate V02 dependency boundary prerequisite
        shell: powershell
        run: .\scripts\v02-dependency-gate.ps1 -ArtifactsDir artifacts/v07-v02-prerequisite

      - name: Validate ProCad NO-GO production isolation and precision
        shell: powershell
        run: .\scripts\v07-procad-isolation-gate.ps1 -ArtifactsDir artifacts/v07-procad-isolation

      - name: Upload V07 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-v07-procad-isolation-evidence
          path: |
            artifacts/v07-procad-isolation
            artifacts/v07-v02-prerequisite
          if-no-files-found: warn
          retention-days: 14
