name: Stage 02 Dependency Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Directory.Packages.props
      - compliance/**
      - src/**/*.csproj
      - scripts/stage02-audit-packages.py
      - scripts/v02-dependency-gate.ps1
      - .github/workflows/stage02-dependency-audit.yml
  pull_request:
    branches: [main]
    paths:
      - Directory.Packages.props
      - compliance/**
      - src/**/*.csproj
      - scripts/stage02-audit-packages.py
      - scripts/v02-dependency-gate.ps1
      - .github/workflows/stage02-dependency-audit.yml

permissions:
  contents: read

concurrency:
  group: stage02-dependency-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: V02 dependency and Android artifact boundary
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Run V02 dependency gate
        shell: powershell
        run: |
          & .\scripts\v02-dependency-gate.ps1 -ArtifactsDir "artifacts/v02-validation"

      - name: Upload Stage 02 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage02-dependency-evidence
          path: artifacts/v02-validation/
          retention-days: 14
          if-no-files-found: warn
