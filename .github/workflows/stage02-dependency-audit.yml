name: Stage 02 Dependency Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Directory.Packages.props
      - compliance/**
      - scripts/stage02-audit-packages.py
      - .github/workflows/stage02-dependency-audit.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10.0.400
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Validate audit script and committed evidence
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/stage02-audit-packages.py
          test -f compliance/Stage02.DependencyProbe/packages.lock.json
          test -f compliance/stage02-package-manifest.json

      - name: Install pinned Android workload set
        shell: bash
        run: |
          set -euxo pipefail
          test "$(dotnet --version)" = "10.0.400"
          dotnet workload install maui-android
          dotnet workload list | tee /tmp/workloads.txt
          grep -F '10.0.400' /tmp/workloads.txt
          grep -F 'maui-android' /tmp/workloads.txt

      - name: Verify committed locked restore
        shell: bash
        run: |
          set -euxo pipefail
          dotnet restore compliance/Stage02.DependencyProbe/Stage02.DependencyProbe.csproj --locked-mode
          git diff --exit-code -- compliance/Stage02.DependencyProbe/packages.lock.json

      - name: Record resolved graph
        shell: bash
        run: |
          set -euxo pipefail
          dotnet list compliance/Stage02.DependencyProbe/Stage02.DependencyProbe.csproj package --include-transitive --format json > compliance/stage02-resolved-packages.json
          cat compliance/stage02-resolved-packages.json

      - name: Audit package licenses and exact nupkg hashes
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/stage02-audit-packages.py
          grep -F '"result": "PASS"' compliance/stage02-package-manifest.json
          git diff --exit-code -- compliance/stage02-package-manifest.json

      - name: Vulnerability report
        shell: bash
        run: |
          set -euxo pipefail
          dotnet list compliance/Stage02.DependencyProbe/Stage02.DependencyProbe.csproj package --vulnerable --include-transitive | tee compliance/stage02-vulnerabilities.txt
          if grep -Fq 'has the following vulnerable packages' compliance/stage02-vulnerabilities.txt; then
            echo 'Vulnerable package detected' >&2
            exit 1
          fi

      - name: Evidence checksums
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum \
            compliance/Stage02.DependencyProbe/packages.lock.json \
            compliance/stage02-package-manifest.json \
            compliance/stage02-resolved-packages.json \
            compliance/stage02-vulnerabilities.txt

      - name: Upload Stage 02 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage02-dependency-evidence
          if-no-files-found: error
          path: |
            compliance/Stage02.DependencyProbe/packages.lock.json
            compliance/stage02-package-manifest.json
            compliance/stage02-resolved-packages.json
            compliance/stage02-vulnerabilities.txt

  stage08-ios-feasibility:
    if: github.event_name == 'pull_request' && github.head_ref == 'stage08-ios-feasibility-spike'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Stage 08 script syntax
        shell: bash
        run: bash -n scripts/stage08-ios-feasibility.sh

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Install pinned iOS workload set
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version
          dotnet workload install ios
          dotnet workload list

      - name: Select Xcode required by pinned .NET iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "Available Xcode installations:"
          ls -1d /Applications/Xcode*.app || true
          IOS_PACK="$(find "$DOTNET_ROOT/packs" -maxdepth 1 -type d -name 'Microsoft.iOS.Sdk.net10.0_*' -print | head -n 1)"
          if [[ -z "$IOS_PACK" ]]; then
            echo "STAGE08_IOS_SDK_PACK_NOT_FOUND" >&2
            exit 20
          fi
          REQUIRED_XCODE="${IOS_PACK##*_}"
          XCODE_APP="$(python3 - "$REQUIRED_XCODE" <<'PY'
import glob, os, re, sys
required = sys.argv[1]
matching = []
for path in glob.glob('/Applications/Xcode_*.app'):
    name = os.path.basename(path)
    m = re.match(r'Xcode_([0-9]+(?:\.[0-9]+)*)', name)
    if m and (m.group(1) == required or m.group(1).startswith(required + '.')):
        matching.append((tuple(int(x) for x in m.group(1).split('.')), path))
if matching:
    print(max(matching)[1])
PY
)"
          if [[ -z "$XCODE_APP" ]]; then
            echo "STAGE08_REQUIRED_XCODE_NOT_FOUND required=$REQUIRED_XCODE" >&2
            exit 21
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "STAGE08_XCODE_SELECTED required=$REQUIRED_XCODE app=$XCODE_APP"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Run iOS Release and simulator feasibility gate
        shell: bash
        run: bash scripts/stage08-ios-feasibility.sh "$RUNNER_TEMP/stage08-ios"

      - name: Upload Stage 08 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage08-ios-feasibility-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage08-ios/stage08-evidence.json
            ${{ runner.temp }}/stage08-ios/workloads.txt
            ${{ runner.temp }}/stage08-ios/restore.log
            ${{ runner.temp }}/stage08-ios/package-graph.txt
            ${{ runner.temp }}/stage08-ios/ios-release-build.log
            ${{ runner.temp }}/stage08-ios/app-executable-file.txt
            ${{ runner.temp }}/stage08-ios/trimmer-warnings.txt
            ${{ runner.temp }}/stage08-ios/reflection-warnings.txt
            ${{ runner.temp }}/stage08-ios/font-warnings.txt
            ${{ runner.temp }}/stage08-ios/ios-simulator.log
