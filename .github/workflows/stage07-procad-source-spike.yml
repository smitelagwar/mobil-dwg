name: Stage 07 ProCad Source Spike

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - spikes/ProCad.Android/**
      - scripts/stage07-procad-source-spike.sh
      - .github/workflows/stage07-procad-source-spike.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  procad-source-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Stage 07 script syntax
        shell: bash
        run: bash -n scripts/stage07-procad-source-spike.sh

      - name: Set up .NET 10.0.400
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Install exact Microsoft OpenJDK 21.0.12
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 -o microsoft-jdk-21.0.12-linux-x64.tar.gz https://aka.ms/download-jdk/microsoft-jdk-21.0.12-linux-x64.tar.gz
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 -o microsoft-jdk-21.0.12-linux-x64.tar.gz.sha256sum.txt https://aka.ms/download-jdk/microsoft-jdk-21.0.12-linux-x64.tar.gz.sha256sum.txt
          sha256sum -c microsoft-jdk-21.0.12-linux-x64.tar.gz.sha256sum.txt
          mkdir -p "$RUNNER_TEMP/msopenjdk-21.0.12"
          tar -xzf microsoft-jdk-21.0.12-linux-x64.tar.gz -C "$RUNNER_TEMP/msopenjdk-21.0.12" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/msopenjdk-21.0.12" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/msopenjdk-21.0.12/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=0 "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install pinned MAUI Android workload
        shell: bash
        run: |
          set -euxo pipefail
          dotnet workload install maui-android
          dotnet workload list | tee /tmp/stage07-workloads.txt
          grep -F '10.0.400' /tmp/stage07-workloads.txt
          grep -F 'maui-android' /tmp/stage07-workloads.txt

      - name: Run Stage 07 ProCad decision harness
        shell: bash
        run: |
          bash scripts/stage07-procad-source-spike.sh \
            "$RUNNER_TEMP/mobil-dwg-stage07" \
            "$RUNNER_TEMP/stage07-procad-evidence.json"

      - name: Upload Stage 07 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage07-procad-source-spike-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/stage07-procad-evidence.json
            ${{ runner.temp }}/mobil-dwg-stage07/precision.json
            ${{ runner.temp }}/mobil-dwg-stage07/nuget-availability.json
            ${{ runner.temp }}/mobil-dwg-stage07/nuget-resolved-summary.json
            ${{ runner.temp }}/mobil-dwg-stage07/nuget-restore.log
            ${{ runner.temp }}/mobil-dwg-stage07/nuget-restore-graph.txt
            ${{ runner.temp }}/mobil-dwg-stage07/source-package-graph.txt
            ${{ runner.temp }}/mobil-dwg-stage07/procad-android-build.log
            ${{ runner.temp }}/mobil-dwg-stage07/procad-maui-smoke.log
            ${{ runner.temp }}/mobil-dwg-stage07/ProCad.Controls.Maui.csproj.original
            ${{ runner.temp }}/mobil-dwg-stage07/Stage07ProCadAndroidSmoke/bin/Release/net10.0-android/**/*.apk

  sync-checkpoint:
    if: github.event_name == 'pull_request' && github.head_ref == 'stage07-procad-source-spike'
    needs: procad-source-spike
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: stage07-procad-source-spike
          fetch-depth: 0

      - name: Patch Stage 07 closure records
        run: python3 scripts/stage07-close-checkpoint.py

      - name: Restore permanent workflow and remove one-shot helpers
        run: |
          git checkout 4f4b13c5bdb8a74d3a642dd635c2b729c1567f55 -- .github/workflows/stage07-procad-source-spike.yml
          rm -f scripts/stage07-close-checkpoint.py
          rm -f .github/workflows/stage07-close-checkpoint.yml
          rm -f stage07-close.trigger

      - name: Commit synchronized checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(stage07): close ProCad NO-GO checkpoint"
          git push origin HEAD:stage07-procad-source-spike
