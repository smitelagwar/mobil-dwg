name: Android V09 Render Scene Revalidation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/MobilDwg.Core/Rendering/**
      - src/MobilDwg.Rendering/**
      - src/MobilDwg.Cad/**
      - src/MobilDwg.App/**
      - tests/MobilDwg.Core.Tests/**
      - tests/MobilDwg.Rendering.Tests/**
      - tests/MobilDwg.Architecture.Tests/**
      - Directory.Packages.props
      - MobilDwg.sln
      - scripts/v02-dependency-gate.ps1
      - scripts/v09-render-scene-gate.ps1
      - docs/evidence/android-validation/V09.md
      - .github/workflows/android-v09-validation.yml

permissions:
  contents: read

jobs:
  render-scene-revalidation:
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 40

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Revalidate V02 dependency boundary prerequisite
        shell: powershell
        run: .\scripts\v02-dependency-gate.ps1 -ArtifactsDir artifacts/v09-v02-prerequisite

      - name: Revalidate RenderScene camera diagnostics and Android composition
        shell: powershell
        run: .\scripts\v09-render-scene-gate.ps1 -ArtifactsDir artifacts/v09-render-scene

      - name: Upload V09 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-v09-render-scene-evidence
          path: |
            artifacts/v09-render-scene
            artifacts/v09-v02-prerequisite
          if-no-files-found: warn
          retention-days: 14
