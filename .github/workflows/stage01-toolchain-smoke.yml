name: Stage 01 Toolchain Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - global.json
      - Directory.Packages.props
      - .github/workflows/stage01-toolchain-smoke.yml
      - scripts/stage01-device-gate.sh
      - scripts/stage01-device-gate.ps1
      - scripts/stage01-ios-inventory.sh
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  STAGE01_SMOKE_ROOT: ${{ runner.temp }}/mobil-dwg-stage01-smoke

jobs:
  android-toolchain-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Stage 01 gate scripts
        shell: bash
        run: |
          set -euxo pipefail
          bash -n scripts/stage01-device-gate.sh
          bash -n scripts/stage01-ios-inventory.sh
          pwsh -NoProfile -NonInteractive -Command '$null = [scriptblock]::Create((Get-Content -Raw "scripts/stage01-device-gate.ps1"))'

      - name: Set up .NET 10.0.400
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Install exact Microsoft OpenJDK 21.0.12
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 -o microsoft-jdk-21.0.12-linux-x64.tar.gz https://aka.ms/download-jdk/microsoft-jdk-21.0.12-linux-x64.tar.gz
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 -o microsoft-jdk-21.0.12-linux-x64.tar.gz.sha256sum.txt https://aka.ms/download-jdk/microsoft-jdk-21.0.12-linux-x64.tar.gz.sha256sum.txt
          sha256sum -c microsoft-jdk-21.0.12-linux-x64.tar.gz.sha256sum.txt
          mkdir -p "$RUNNER_TEMP/msopenjdk-21.0.12"
          tar -xzf microsoft-jdk-21.0.12-linux-x64.tar.gz -C "$RUNNER_TEMP/msopenjdk-21.0.12" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/msopenjdk-21.0.12" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/msopenjdk-21.0.12/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=0 "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify host toolchain
        shell: bash
        run: |
          set -euxo pipefail
          test "$(dotnet --version)" = "10.0.400"
          dotnet --info
          java -version 2>&1 | tee /tmp/java-version.txt
          grep -F '21.0.12' /tmp/java-version.txt
          adb version | tee /tmp/adb-version.txt
          grep -F 'Version 37.0.1' /tmp/adb-version.txt
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

      - name: Install pinned MAUI Android workload
        shell: bash
        run: |
          dotnet workload install maui-android
          dotnet workload list

      - name: Create isolated clean MAUI smoke app and pin API baseline
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$STAGE01_SMOKE_ROOT"
          mkdir -p "$STAGE01_SMOKE_ROOT"
          dotnet new maui -n Stage01Smoke -o "$STAGE01_SMOKE_ROOT/Stage01Smoke"
          csproj="$STAGE01_SMOKE_ROOT/Stage01Smoke/Stage01Smoke.csproj"
          sed -i 's/>21.0<\/SupportedOSPlatformVersion>/>24.0<\/SupportedOSPlatformVersion>/' "$csproj"
          sed -i 's#<ApplicationId>com.companyname.stage01smoke</ApplicationId>#<ApplicationId>com.smitelagwar.mobildwg.stage01smoke</ApplicationId>#' "$csproj"
          grep -F '>24.0</SupportedOSPlatformVersion>' "$csproj"
          grep -F '<ApplicationId>com.smitelagwar.mobildwg.stage01smoke</ApplicationId>' "$csproj"
          test ! -f "$STAGE01_SMOKE_ROOT/Directory.Packages.props"

      - name: Build Debug Android smoke
        shell: bash
        run: |
          dotnet build "$STAGE01_SMOKE_ROOT/Stage01Smoke/Stage01Smoke.csproj" -f net10.0-android -c Debug --no-restore

      - name: Build Release Android smoke
        shell: bash
        run: |
          dotnet build "$STAGE01_SMOKE_ROOT/Stage01Smoke/Stage01Smoke.csproj" -f net10.0-android -c Release --no-restore

      - name: Verify API baseline
        shell: bash
        run: |
          set -euxo pipefail
          manifest="$STAGE01_SMOKE_ROOT/Stage01Smoke/obj/Debug/net10.0-android/android/manifest/AndroidManifest.xml"
          test -f "$manifest"
          cat "$manifest"
          grep -E 'minSdkVersion="24"|minSdkVersion="24.0"' "$manifest"
          grep -E 'targetSdkVersion="36"|targetSdkVersion="36.0"' "$manifest"
          grep -F 'package="com.smitelagwar.mobildwg.stage01smoke"' "$manifest"

      - name: Upload smoke APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage01-maui-android-smoke
          if-no-files-found: warn
          path: |
            ${{ env.STAGE01_SMOKE_ROOT }}/Stage01Smoke/bin/Debug/net10.0-android/**/*.apk
            ${{ env.STAGE01_SMOKE_ROOT }}/Stage01Smoke/bin/Release/net10.0-android/**/*.apk
