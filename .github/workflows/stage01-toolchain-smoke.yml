name: Stage 01 Toolchain Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - global.json
      - .github/workflows/stage01-toolchain-smoke.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-toolchain-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10.0.400
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Install exact Microsoft OpenJDK 21.0.12
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://aka.ms/download-jdk/microsoft-jdk-21.0.12-linux-x64.tar.gz
          curl -fsSLO https://aka.ms/download-jdk/microsoft-jdk-21.0.12-linux-x64.tar.gz.sha256sum.txt
          sha256sum -c microsoft-jdk-21.0.12-linux-x64.tar.gz.sha256sum.txt
          mkdir -p "$RUNNER_TEMP/msopenjdk-21.0.12"
          tar -xzf microsoft-jdk-21.0.12-linux-x64.tar.gz -C "$RUNNER_TEMP/msopenjdk-21.0.12" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/msopenjdk-21.0.12" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/msopenjdk-21.0.12/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify host toolchain
        shell: bash
        run: |
          set -euxo pipefail
          test "$(dotnet --version)" = "10.0.400"
          dotnet --info
          java -version 2>&1 | tee /tmp/java-version.txt
          grep -F '21.0.12' /tmp/java-version.txt
          adb version | tee /tmp/adb-version.txt
          grep -F 'Version 37.0.0' /tmp/adb-version.txt
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

      - name: Install pinned MAUI Android workload
        shell: bash
        run: |
          dotnet workload install maui-android --version 10.0.400
          dotnet workload list

      - name: Create clean MAUI smoke app
        shell: bash
        run: |
          rm -rf .smoke
          dotnet new maui -n Stage01Smoke -o .smoke/Stage01Smoke

      - name: Build Debug Android smoke
        shell: bash
        run: |
          dotnet build .smoke/Stage01Smoke/Stage01Smoke.csproj -f net10.0-android -c Debug --no-restore

      - name: Build Release Android smoke
        shell: bash
        run: |
          dotnet build .smoke/Stage01Smoke/Stage01Smoke.csproj -f net10.0-android -c Release --no-restore

      - name: Verify API baseline
        shell: bash
        run: |
          set -euxo pipefail
          manifest=$(find .smoke/Stage01Smoke/obj -path '*net10.0-android*' -name AndroidManifest.xml | head -n 1)
          test -n "$manifest"
          cat "$manifest"
          grep -E 'minSdkVersion="24"|minSdkVersion="24.0"' "$manifest"
          grep -E 'targetSdkVersion="36"|targetSdkVersion="36.0"' "$manifest"

      - name: Upload smoke APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage01-maui-android-smoke
          if-no-files-found: warn
          path: |
            .smoke/Stage01Smoke/bin/Debug/net10.0-android/**/*.apk
            .smoke/Stage01Smoke/bin/Release/net10.0-android/**/*.apk
