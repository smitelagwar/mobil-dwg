name: Android Real-App Regression

# Expensive device validation stays opt-in: push to android-test or manual dispatch.
on:
  push:
    branches:
      - android-test
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-real-app-${{ github.repository }}
  cancel-in-progress: false

jobs:
  android-real-app:
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify local Android environment
        shell: powershell
        run: .\scripts\doctor-local-environment.ps1

      - name: Start or reuse API 36 emulator
        shell: powershell
        run: .\scripts\start-emulator.ps1

      - name: Run real-app blocker regression gate
        shell: powershell
        run: .\scripts\a25-android-beta-blocker-gate.ps1

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-real-app-regression
          path: artifacts/a25-android-beta-blocker/
          retention-days: 14

      - name: Stop emulator
        if: always()
        shell: powershell
        run: .\scripts\stop-emulator.ps1
