name: Stage 03 Corpus Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - fixtures/**
      - docs/GOLDEN_CONTRACT.md
      - docs/DEVICE_MATRIX.md
      - scripts/stage03-validate-fixtures.py
      - scripts/stage03-verify-integrity.py
      - scripts/stage03-generate-synthetic-dwg.ps1
      - .github/workflows/stage03-corpus-audit.yml
      - .gitattributes
      - .gitignore
  push:
    branches: [main]
    paths:
      - fixtures/**
      - docs/GOLDEN_CONTRACT.md
      - docs/DEVICE_MATRIX.md
      - scripts/stage03-validate-fixtures.py
      - scripts/stage03-verify-integrity.py
      - scripts/stage03-generate-synthetic-dwg.ps1
      - .github/workflows/stage03-corpus-audit.yml
      - .gitattributes
      - .gitignore

permissions:
  contents: read

concurrency:
  group: stage03-corpus-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corpus-audit:
    name: V03 fixture, provenance and Android smoke-set contract
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 20

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Validate toolchain and script syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ((dotnet --version).Trim() -ne "10.0.400") { throw "Expected .NET SDK 10.0.400" }
          python --version
          python -m json.tool fixtures/manifest/schema.json | Out-Null
          python -m json.tool fixtures/manifest/stage03-mini.json | Out-Null
          python -m json.tool fixtures/manifest/stage03-source-integrity.json | Out-Null
          python -m py_compile scripts/stage03-validate-fixtures.py scripts/stage03-verify-integrity.py
          Write-Host "V03_TOOLCHAIN_AND_SYNTAX_PASS"

      - name: Generate redistributable synthetic DWG smoke artifact
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $generatedDir = Join-Path $env:RUNNER_TEMP "mobil-dwg-stage03-generated"
          $output = Join-Path $generatedDir "synthetic_turkish_basic_ac1015.dwg"
          & .\scripts\stage03-generate-synthetic-dwg.ps1 -OutputDwg $output
          $item = Get-Item -LiteralPath $output
          $sha = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "generator=ACadSharp-3.7.1"
            "source_fixture=synthetic-turkish-basic-ac1015"
            "format=dwg"
            "acad_version=AC1015"
            "bytes=$($item.Length)"
            "sha256=$sha"
            "claim_limit=generated-readback-smoke-not-independent-fidelity-golden"
          ) | Set-Content -LiteralPath (Join-Path $generatedDir "generated-dwg-evidence.txt") -Encoding ASCII
          Write-Host "V03_GENERATED_DWG_EVIDENCE_PASS bytes=$($item.Length) sha256=$sha"

      - name: Validate corpus access, hashes, provenance and private boundary
        shell: powershell
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "mobil-dwg-stage03-cache"
          $evidence = Join-Path $env:RUNNER_TEMP "stage03-fixture-audit.json"
          python scripts/stage03-validate-fixtures.py --manifest fixtures/manifest/stage03-mini.json --cache $cache --evidence $evidence

      - name: Verify immutable-source dual hashes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:RUNNER_TEMP "stage03-fixture-audit.json"
          python scripts/stage03-verify-integrity.py --audit $evidence --integrity fixtures/manifest/stage03-source-integrity.json
          Write-Host "ANDROID_VALIDATION_V03_PASS"

      - name: Upload Stage 03 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage03-corpus-evidence
          path: |
            ${{ runner.temp }}/stage03-fixture-audit.json
            ${{ runner.temp }}/mobil-dwg-stage03-generated/synthetic_turkish_basic_ac1015.dwg
            ${{ runner.temp }}/mobil-dwg-stage03-generated/generated-dwg-evidence.txt
          retention-days: 14
          if-no-files-found: warn
