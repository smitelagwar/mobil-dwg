name: Stage 09 Post-Merge Closure

on:
  push:
    branches:
      - stage09-postmerge-closure
    paths:
      - '.github/workflows/stage09-postmerge-closure.yml'
      - 'scripts/stage09-postmerge-closure.ps1'
      - 'scripts/stage09-postmerge-closure-data.json'

permissions:
  contents: write

jobs:
  close-stage09:
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply post-merge closure patch
        shell: powershell
        run: .\scripts\stage09-postmerge-closure.ps1

      - name: Commit closure updates
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVAM.md Mobil_DWG_DXF_Royalty_Free_Android_iOS_Nihai_Plan.md docs/EXECUTION_LOG.md docs/evidence/STAGE_09.md gecmis.md
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m 'docs(stage09): complete post-merge closure audit'
            git push origin HEAD:stage09-postmerge-closure
          } else {
            throw 'No Stage09 closure documentation changes produced'
          }
