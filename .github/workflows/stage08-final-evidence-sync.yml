name: Stage 08 Final Evidence Sync

on:
  push:
    branches:
      - stage08-ios-feasibility-closure
    paths:
      - .github/workflows/stage08-final-evidence-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage08-ios-feasibility-closure
          fetch-depth: 0

      - name: Pin final current-main Stage 08 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path('Mobil_DWG_DXF_Royalty_Free_Android_iOS_Nihai_Plan.md'),
              Path('gecmis.md'),
              Path('DEVAM.md'),
              Path('docs/EXECUTION_LOG.md'),
              Path('docs/evidence/STAGE_08.md'),
          ]
          old_run = '32776201092'
          new_run = '32781026946'
          old_artifact = '9538345504'
          new_artifact = '9540018558'
          old_digest = '527956939b41b04b91cc79af04d821238f111d6f8a5a121598809a3830746b72'
          new_digest = '1414e3bf5a9800e150019c48f620c64efcd3d5282ac7322ef9a5e5746ab746f7'

          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace(old_run, new_run)
              text = text.replace(old_artifact, new_artifact)
              text = text.replace(old_digest, new_digest)
              text = text.replace('run `32781026946` / #17', 'run `32781026946` / #18')
              text = text.replace('run `32781026946`/#17', 'run `32781026946`/#18')
              text = text.replace('run 32781026946 / #17', 'run 32781026946 / #18')
              text = text.replace('run `32781026946` / #17 `SUCCESS`', 'run `32781026946` / #18 `SUCCESS`')
              path.write_text(text, encoding='utf-8')

          evidence = Path('docs/evidence/STAGE_08.md')
          text = evidence.read_text(encoding='utf-8')
          text = text.replace(
              '- Esas spike head: `1d7ce7ddc738ba615ad86f19742e3af9f2c78e18`.',
              '- İlk tamamlanmış spike head: `1d7ce7ddc738ba615ad86f19742e3af9f2c78e18`.\n- Güncel `main` tabanına taşınmış final verification head: `4987fa3e5fadfb113aa3b27ac443da9776864ad5`.'
          )
          text = text.replace(
              '## Yetkili karakterizasyon koşusu',
              '## Yetkili final karakterizasyon koşusu'
          )
          if 'Önceki run #17' not in text:
              anchor = '- Evidence JSON classification: `BLOCKED_PARTIAL_EVIDENCE`.\n'
              note = ('\nÖnceki run #17 aynı karakterizasyonu eski base üzerinde üretmişti. '
                      'Final kabul kanıtı, güncel `main` tabanlı PR #11 head üzerinde tekrar edilen run #18 ve artifact `9540018558`dir.\n')
              text = text.replace(anchor, anchor + note)
          evidence.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/stage08-final-evidence-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mobil_DWG_DXF_Royalty_Free_Android_iOS_Nihai_Plan.md gecmis.md DEVAM.md docs/EXECUTION_LOG.md docs/evidence/STAGE_08.md .github/workflows/stage08-final-evidence-sync.yml
          git commit -m "docs(stage08): pin final current-main characterization evidence"
          git push origin HEAD:stage08-ios-feasibility-closure
