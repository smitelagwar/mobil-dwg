name: A10 P0 Geometry Android Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/MobilDwg.App/**'
      - 'src/MobilDwg.Core/**'
      - 'src/MobilDwg.Rendering/**'
      - 'tests/MobilDwg.Rendering.Tests/**'
      - 'tests/MobilDwg.Architecture.Tests/**'
      - 'Directory.Packages.props'
      - 'scripts/a10-android-render-gate.ps1'
      - '.github/workflows/a10-p0-geometry-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a10-real-android-render:
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 40
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Revalidate V02 dependency boundary
        shell: powershell
        run: .\scripts\v02-dependency-gate.ps1 -ArtifactsDir artifacts/a10-android-render/v02-prerequisite

      - name: Revalidate V03 fixture provenance contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m json.tool fixtures/manifest/schema.json | Out-Null
          python -m json.tool fixtures/manifest/stage03-mini.json | Out-Null
          python -m json.tool fixtures/manifest/stage03-source-integrity.json | Out-Null
          $cache = Join-Path $env:RUNNER_TEMP 'mobil-dwg-a10-stage03-cache'
          $evidence = Join-Path $env:RUNNER_TEMP 'a10-stage03-fixture-audit.json'
          python scripts/stage03-validate-fixtures.py --manifest fixtures/manifest/stage03-mini.json --cache $cache --evidence $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/stage03-verify-integrity.py --audit $evidence --integrity fixtures/manifest/stage03-source-integrity.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $evidence -Destination artifacts/a10-android-render/a10-stage03-fixture-audit.json -Force
          Write-Host 'ANDROID_VALIDATION_V03_PASS'

      - name: Revalidate V01 emulator infrastructure
        shell: powershell
        run: .\scripts\android-emulator-gate.ps1 -Configuration Release -ArtifactsDir artifacts/a10-android-render/v01-infrastructure-prerequisite -AvdName mobil-dwg-api36 -Headless

      - name: Validate P0 geometry renderer in real MobilDwg.App
        shell: powershell
        run: .\scripts\a10-android-render-gate.ps1 -Configuration Release -ArtifactsDir artifacts/a10-android-render

      - name: Upload A10 Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a10-p0-geometry-android-evidence
          path: artifacts/a10-android-render
          if-no-files-found: warn
          retention-days: 14
