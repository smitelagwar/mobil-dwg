name: Stage 04 Canonical Plan Closeout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage04-plan-closeout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Guarded plan update
        run: python3 scripts/stage04-finalize-canonical.py

      - name: Verify only canonical plan changed
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "Mobil_DWG_DXF_Royalty_Free_Android_iOS_Nihai_Plan.md"
          grep -F 'CURRENT_STAGE: AŞAMA 04' Mobil_DWG_DXF_Royalty_Free_Android_iOS_Nihai_Plan.md
          grep -F 'STATUS: DONE' Mobil_DWG_DXF_Royalty_Free_Android_iOS_Nihai_Plan.md
          grep -F 'AŞAMA 05 — ACadSharp headless parser spike — `NEXT`' Mobil_DWG_DXF_Royalty_Free_Android_iOS_Nihai_Plan.md

      - name: Commit canonical closeout
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mobil_DWG_DXF_Royalty_Free_Android_iOS_Nihai_Plan.md
          git commit -m 'docs: mark stage 04 complete in canonical plan'
          git push origin HEAD:main
