name: Stage 04 Architecture

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - MobilDwg.sln
      - Directory.Build.props
      - src/**
      - tests/**
      - scripts/stage04-test.sh
      - docs/ARCHITECTURE.md
      - docs/evidence/STAGE_04.md
      - .github/workflows/stage04-architecture.yml
  push:
    branches: [main]
    paths:
      - MobilDwg.sln
      - Directory.Build.props
      - src/**
      - tests/**
      - scripts/stage04-test.sh
      - docs/ARCHITECTURE.md
      - .github/workflows/stage04-architecture.yml

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10.0.400
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Install pinned workload set required by global.json
        shell: bash
        run: |
          set -euxo pipefail
          test "$(dotnet --version)" = "10.0.400"
          dotnet workload install maui-android
          dotnet workload list | tee /tmp/stage04-workloads.txt
          grep -F '10.0.400' /tmp/stage04-workloads.txt
          grep -F 'maui-android' /tmp/stage04-workloads.txt

      - name: Validate Stage 04 test script
        shell: bash
        run: |
          set -euxo pipefail
          bash -n scripts/stage04-test.sh

      - name: Restore, build and run T0/contract/architecture tests
        shell: bash
        run: bash scripts/stage04-test.sh
