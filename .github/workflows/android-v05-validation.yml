name: Android V05 Real App Parser

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Directory.Packages.props
      - src/MobilDwg.App/**
      - src/MobilDwg.Cad/**
      - src/MobilDwg.Core/**
      - tests/MobilDwg.Architecture.Tests/**
      - tools/Stage05.ParserProbe/**
      - scripts/android-emulator-gate.ps1
      - scripts/stage03-generate-synthetic-dwg.ps1
      - scripts/stage03-validate-fixtures.py
      - scripts/stage05-parser-spike.sh
      - scripts/v05-real-app-parser-gate.ps1
      - fixtures/manifest/stage03-mini.json
      - fixtures/public/synthetic/**
      - .github/workflows/android-v05-validation.yml

permissions:
  contents: read

jobs:
  real-app-parser:
    runs-on: [self-hosted, windows, android-test, mobil-dwg]
    timeout-minutes: 35

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: true

      - name: Revalidate V01 infrastructure prerequisite
        shell: powershell
        run: .\scripts\android-emulator-gate.ps1 -Configuration Release -ArtifactsDir artifacts/v05-v01-prerequisite -AvdName mobil-dwg-api36 -Headless

      - name: Validate ACadSharp parser in real MobilDwg.App
        shell: powershell
        run: .\scripts\v05-real-app-parser-gate.ps1 -Configuration Release -ArtifactsDir artifacts/v05-parser

      - name: Upload V05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-v05-real-app-parser-evidence
          path: |
            artifacts/v05-parser
            artifacts/v05-v01-prerequisite/summary.txt
          if-no-files-found: warn
          retention-days: 14
