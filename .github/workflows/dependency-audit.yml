name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Packages.props'
      - 'src/**/*.csproj'
      - 'compliance/DependencyProbe/**'
      - 'compliance/package-manifest.json'
      - 'scripts/audit-packages.py'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Directory.Packages.props'
      - 'src/**/*.csproj'
      - 'compliance/DependencyProbe/**'
      - 'compliance/package-manifest.json'
      - 'scripts/audit-packages.py'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'

      - name: Install pinned Android workload
        shell: bash
        run: dotnet workload install maui-android

      - name: Locked restore Android dependency probe
        shell: bash
        run: dotnet restore compliance/DependencyProbe/DependencyProbe.csproj --locked-mode

      - name: Audit exact package graph and licenses
        shell: bash
        run: python3 scripts/audit-packages.py

      - name: Require reproducible manifest
        shell: bash
        run: git diff --exit-code -- compliance/package-manifest.json

      - name: Vulnerability report
        shell: bash
        run: dotnet list compliance/DependencyProbe/DependencyProbe.csproj package --vulnerable --include-transitive
